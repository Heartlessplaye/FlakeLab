name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --junitxml=reports/report.xml

      - name: Save the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-${{ github.run_attempt }}
          path: reports/report.xml